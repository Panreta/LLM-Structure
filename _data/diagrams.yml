# One entry per diagram, in home-page order.
# Blocks live in _posts/<id>/ (or set `diagram: <id>` in a block's front matter).
- id: transformer-wavefunction
  title: Transformer wavefunction
  labels: [Large Language Model]
  description: "A transformer that outputs fermionic orbitals; a determinant turns them into an antisymmetric wavefunction."

- id: riemann-integral
  title: Riemann integral
  labels: [Calculus]
  figure: riemann-integral
  description: "Area under y = x² as the limit of rectangle sums, and the antiderivative shortcut that skips the limit."

- id: diagonalization
  title: Diagonalization
  labels: [Linear Algebra]
  figure: diagonalization
  description: "A 2×2 matrix acting on the plane: the grid shears, the circle becomes an ellipse, and eigenvectors only stretch."

- id: bayes-rule
  title: Bayes' rule
  labels: [Probability]
  figure: bayes-rule
  description: "Prior, likelihood and posterior for a coin's bias: watch the belief sharpen as flips come in."

- id: gradient-descent
  title: From gradient descent to Muon
  labels: [Optimization, Calculus, Large Language Model]
  figure: gradient-descent
  description: "One narrow valley, nine blocks: gradient descent, momentum, Nesterov, RMSProp, Adam, AdamW and Muon, each fixing what the last one got wrong."

- id: least-squares
  title: Least squares
  labels: [Linear Algebra, Optimization, Probability]
  figure: least-squares
  description: "Fit a line to points by minimizing the total area of the residual squares; drag the points."

- id: high-dimension
  title: High-dimensional geometry
  labels: [Probability, Geometry]
  figure: high-dimension
  description: "Why random vectors have length about 1 and are nearly orthogonal, how that gives the Johnson–Lindenstrauss lemma, and why a high-dimensional ball keeps its mass on the shell."

- id: grpo
  title: Group Relative Policy Optimization
  labels: [Large Language Model, Optimization]
  figure: grpo
  description: "The objective behind DeepSeek-R1, built step by step: Markov decision processes, the trust-region problem, TRPO, PPO, and what GRPO changes."

- id: rope
  title: Rotary position embedding
  labels: [Large Language Model, Linear Algebra]
  figure: rope
  description: "Derive RoPE from one requirement, that attention scores depend only on relative position: lengths stay, angles turn by mθ."

- id: fem
  title: Finite element method
  labels: [Numerical Analysis, Linear Algebra]
  figure: fem
  description: "From the weak form and the Lax–Milgram theorem to hat functions, assembly and convergence, ending with a live heat simulation on an L-shaped plate."

- id: bregman-kl
  title: Bregman divergence and KL
  labels: [Probability, Optimization]
  figure: bregman-kl
  description: "The gap between a convex function and its tangent: with negative entropy it becomes the KL divergence, then cross-entropy and the limit of optimal coding."

- id: normal
  title: Normal distribution
  labels: [Probability]
  figure: normal
  description: "The bell curve, then ellipses in 2-D and a fog ball in 3-D that is dense inside and sparse outside, how to picture it in any dimension, and the quantum oscillator whose ground state is exactly Gaussian."

- id: black-scholes
  title: From Brownian motion to Black–Scholes
  labels: [Probability, Calculus, Finance]
  figure: black-scholes
  description: "Random walks become Brownian motion; quadratic variation forces Itô's calculus; a self-financing hedge turns it into the Black–Scholes equation, its formula, and risk-neutral pricing."

- id: euler-lagrange
  title: Euler–Lagrange equation
  labels: [Calculus, Optimization, Physics]
  figure: euler-lagrange
  description: "Vary a path, integrate by parts, and the Euler–Lagrange equation appears: shortest paths are lines, the brachistochrone is a cycloid, and the same idea gives Newton, Hamilton and optimal control."
